[platformio]
default_envs = m5stack-cardputer, m5stack-sticks3, m5stack-stopwatch
src_dir = .

[env:m5stack-cardputer]
platform = espressif32
board    = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DARDUINO_M5Stack_Cardputer
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps = 
	m5stack/M5GFX
	m5stack/M5Unified
	m5stack/M5Cardputer
	bblanchon/ArduinoJson

[env:m5stack-sticks3]
platform = espressif32
board    = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps = 
	m5stack/M5GFX
	m5stack/M5Unified
	m5stack/M5Cardputer
	bblanchon/ArduinoJson

[env:m5stack-stopwatch]
platform = espressif32
board    = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DESP32S3
    -DTARGET_STOPWATCH
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps = 
	m5stack/M5GFX
	m5stack/M5Unified
	bblanchon/ArduinoJson
